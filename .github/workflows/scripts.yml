name: Cross-platform script checks

on:
  push:
    branches: [main, lynkplay]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check Python scripts
        run: |
          uv run --locked python -m compileall -q scripts
          uv run --locked scripts/check_public_tree.py
          uv run --locked scripts/import_diplay_authentication.py --help
          uv run --locked scripts/initialize_lynkplay_signing.py --help
          uv run --locked scripts/build_lynkplay_car_test.py --help
      - name: Check static-site generation
        run: |
          uv run --locked scripts/build_site.py
          git diff --exit-code -- site
